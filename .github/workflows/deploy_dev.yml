name: next-blog deploy
on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        
      - name: Set env
        run: |
          touch ./.env.local
          echo "${{ secrets.NODE_ENV }}" > ./next/.env.local
        shell: bash

      - name: Build Next
        run: |
          cd ./next
          npm install
          npm run build
        shell: bash

      - name: Login dockerHub
        run: |
          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PWD }}
          docker build -t ${{ secrets.DOCKER_USER }}/next-blog . 
          docker push ${{ secrets.DOCKER_USER }}/next-blog:latest
      
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PWD }}
            docker-compose down || true
            docker image prune -f
            docker pull ${{ secrets.DOCKER_USER }}/next-blog:latest
            docker-compose up -d